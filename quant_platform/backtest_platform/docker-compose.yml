# Local stack for personal EOD development.
# TimescaleDB is the only containerized service the current app needs for
# FastAPI monitor telemetry and frontend happy-path audits.
# Tear down with: docker compose down
# Volumes persist; use `docker compose down -v` to wipe.

services:
  timescaledb:
    image: timescale/timescaledb:2.14.2-pg16
    container_name: quant-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_local_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-quant_trading}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/timescaledb/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant} -d ${POSTGRES_DB:-quant_trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescaledb_data:
