# Grafana datasource provisioning — InfluxDB 2.7 (the metrics DB the app pushes to
# via monitoring/influx_writer.py). Auto-loaded by Grafana on startup (dashboards
# reference it by uid `influxdb-metrics`). doc 20 §3.1.
apiVersion: 1

datasources:
  - name: InfluxDB-metrics
    uid: influxdb-metrics
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    editable: true
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG:-quant}
      defaultBucket: ${INFLUXDB_BUCKET:-metrics}
      tlsSkipVerify: true
    secureJsonData:
      token: ${INFLUXDB_TOKEN:-local-dev-token}
