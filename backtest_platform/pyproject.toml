[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest_platform"
version = "0.1.0"
description = "Four-Layer Resonance Strategy Backtest Platform for Taiwan Stocks"
readme = "README.md"
requires-python = ">=3.10,<3.13"  # zipline-reloaded 3.1.1 支援 3.10-3.12（ADR-013 upgrade 2026-06-01）
license = { text = "Proprietary" }
authors = [{ name = "Self" }]

dependencies = [
    # Data
    # pandas 2.x + numpy 2.x (zipline-reloaded 3.1.1 直接相容；2026-06-01 升級開放 vectorbt)
    "pandas>=2.0,<3",
    "numpy>=2.0,<3",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "psycopg2-binary>=2.9",
    # SQLAlchemy 升回 2.x（zipline-reloaded 3.0.4 支援，比 zipline-tej 進步）
    "sqlalchemy>=2.0",
    "FinMind>=1.7",
    # Strategy / Math
    "scipy>=1.12",
    # Note: ta-lib-bin removed 2026-06-01 (Spike S1) — M1 indicators 全自寫純 numpy
    # /pandas，無 import talib；ta-lib-bin 0.4.26 也無 Windows wheel
    # Backtest engines (installed selectively per milestone)
    # vectorbt has heavy native deps; opt-in via extras.
    # Utilities
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# M2 mainframe: zipline-reloaded (社群維護 zipline 主線，0 商業綁定) — ADR-013 supersedes ADR-005
mainframe = [
    "zipline-reloaded==3.1.1",
    "exchange-calendars>=4.5",
]
# Vector engine for grid/WFA optimization — see ADR-007
# 2026-06-01 起與 zipline-reloaded 3.1.1 / pandas 2 同棧相容（ADR-013 升級）
engines = [
    "vectorbt>=1.0",
]
# Paid data source — see ADR-006 (Note: requires FINLAB_API_TOKEN)
data_paid = [
    "finlab>=1.2",
]
validation = [
    "quantstats>=0.0.62",
    "pyfolio-reloaded>=0.9.6",
    "empyrical-reloaded>=0.5.10",
    "hmmlearn>=0.3",
    "ruptures>=1.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "websockets>=12",
]
# Streamlit dashboard — see ADR-009 + dev_docs/20_dashboard_specification.md
ui = [
    "streamlit>=1.32",
    "plotly>=5.20",
]
broker = [
    "shioaji>=1.2",
]
# Monitoring stack — see ADR-009 (Discord notifier, migrated from Telegram)
monitoring = [
    "prometheus-client>=0.20",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    # pytest-asyncio <0.24 calls Package.obj which pytest 9 removed —
    # causes "AttributeError: 'Package' object has no attribute 'obj'" at collection.
    "pytest-asyncio>=0.24",
    "ruff>=0.3",
    "mypy>=1.9",
]
# Convenience: install M2 Sprint 1 requirements
sprint1 = [
    "zipline-reloaded==3.1.1",
    "exchange-calendars>=4.5",
    "finlab>=1.2",
    "streamlit>=1.32",
    "plotly>=5.20",
    "shioaji>=1.2",
    # monitoring required for Discord notifier tests
    "prometheus-client>=0.20",
    "httpx>=0.27",
    # Sprint 2: tearsheet (CLI --tearsheet) + validation comparison
    "quantstats>=0.0.62",
    "empyrical-reloaded>=0.5.10",
    # Sprint 2 cross-check (pandas 2 + zipline 3.1.1 stack 2026-06-01)
    "vectorbt>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "strict"
markers = [
    "integration: requires external services (DB, FinMind API)",
    "slow: takes more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
