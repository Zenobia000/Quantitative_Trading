[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest_platform"
version = "0.1.0"
description = "Four-Layer Resonance Strategy Backtest Platform for Taiwan Stocks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Self" }]

dependencies = [
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "FinMind>=1.7",
    # Strategy / Math
    "scipy>=1.12",
    "ta-lib-bin; sys_platform == 'win32'",
    # Backtest engines (installed selectively per milestone)
    # rqalpha and vectorbt have heavy native deps; opt-in via extras.
    # Utilities
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# M2 mainframe: TQuant-Lab (TEJ Zipline 台股 fork) — see ADR-005
mainframe = [
    "zipline-tej>=2.0",
    "exchange-calendars>=4.5",
]
# Vector engine for grid/WFA optimization — see ADR-007
engines = [
    "vectorbt>=0.26",
]
# Paid data source — see ADR-006 (Note: requires FINLAB_API_TOKEN)
data_paid = [
    "finlab>=1.2",
]
validation = [
    "quantstats>=0.0.62",
    "pyfolio-reloaded>=0.9.6",
    "empyrical-reloaded>=0.5.10",
    "hmmlearn>=0.3",
    "ruptures>=1.1",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "websockets>=12",
]
# Streamlit dashboard — see ADR-009 + dev_docs/20_dashboard_specification.md
ui = [
    "streamlit>=1.32",
    "plotly>=5.20",
]
broker = [
    "shioaji>=1.2",
]
# Monitoring stack — see ADR-009
monitoring = [
    "prometheus-client>=0.20",
    "python-telegram-bot>=21.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
]
# Convenience: install all M2 sprint 0 spike requirements at once
sprint0 = [
    "zipline-tej>=2.0",
    "exchange-calendars>=4.5",
    "finlab>=1.2",
    "vectorbt>=0.26",
    "streamlit>=1.32",
    "plotly>=5.20",
    "shioaji>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires external services (DB, FinMind API)",
    "slow: takes more than 5 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
